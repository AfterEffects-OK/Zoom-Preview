<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Zoom裏録倉庫</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        .dark input[type="time"] {
            color-scheme: dark;
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 p-4 md:p-6 transition-colors duration-300">
    <div class="max-w-7xl mx-auto">
        <!-- ヘッダー -->
        <header class="mb-6 flex justify-between items-center">
            <h1 class="text-2xl md:text-3xl font-bold">Zoom裏録倉庫</h1>
            <div class="flex items-center gap-2">
                <!-- 表示形式切り替えボタン（グリッド ⇔ リスト） -->
                <button onclick="toggleViewMode()" id="viewModeBtn" class="p-2.5 rounded-xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 shadow-sm hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors flex items-center justify-center w-10 h-10" title="表示形式切替">
                    <!-- グリッド表示アイコン（リストモード時に表示） -->
                    <svg id="gridIcon" class="w-5 h-5 text-gray-700 dark:text-gray-300 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    <!-- リスト表示アイコン（グリッドモード時に表示） -->
                    <svg id="listIcon" class="w-5 h-5 text-gray-700 dark:text-gray-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>

                <!-- テーマ切り替えボタン -->
                <button onclick="toggleDarkMode()" class="p-2.5 rounded-xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 shadow-sm hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors flex items-center justify-center w-10 h-10" title="テーマ切替">
                    <!-- 月アイコン（ライトモード時に表示） -->
                    <svg id="moonIcon" class="w-5 h-5 text-gray-700 dark:hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
                    </svg>
                    <!-- 太陽アイコン（ダークモード時に表示） -->
                    <svg id="sunIcon" class="w-5 h-5 text-gray-300 hidden dark:block" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="5"></circle>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
                    </svg>
                </button>
            </div>
        </header>
        
        <!-- 検索・フィルターエリア -->
        <div class="mb-6 grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- キーワード検索 -->
            <input type="text" id="searchInput" placeholder="動画タイトルやキーワードで検索..." 
                   class="p-4 border border-gray-200 dark:border-gray-700 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 placeholder-gray-400">
            
            <!-- 日付フィルター -->
            <select id="dateFilter" class="p-4 border border-gray-200 dark:border-gray-700 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100">
                <option value="">すべての日付</option>
            </select>

            <!-- 時間範囲フィルター（標準の時刻入力） -->
            <div class="flex items-center gap-2 bg-white dark:bg-gray-800 p-2 border border-gray-200 dark:border-gray-700 rounded-xl shadow-sm">
                <input type="time" id="startTimeFilter" class="p-2 border border-gray-200 dark:border-gray-700 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-transparent text-gray-800 dark:text-gray-100" title="開始時間">
                <span class="text-gray-400">〜</span>
                <input type="time" id="endTimeFilter" class="p-2 border border-gray-200 dark:border-gray-700 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-transparent text-gray-800 dark:text-gray-100" title="終了時間">
            </div>
        </div>

        <!-- ローディング表示 -->
        <div id="loading" class="text-center py-12 text-gray-500 text-lg">
            データを読み込んでいます...
        </div>

        <!-- 動画一覧コンテナ -->
        <div id="videoContainer">
            <!-- 動的にコンテンツが挿入されます -->
        </div>
    </div>

    <!-- 動画再生モーダル（プレイリスト＆連続再生対応） -->
    <div id="videoModal" class="fixed inset-0 bg-black bg-opacity-70 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white dark:bg-gray-800 rounded-2xl overflow-hidden max-w-6xl w-full shadow-2xl flex flex-col md:flex-row max-h-[90vh]">
            <!-- 左側：動画プレイヤー ＆ タイトル・ボタン -->
            <div class="flex-1 flex flex-col bg-black">
                <div class="p-4 bg-gray-900 text-white flex justify-between items-center md:hidden">
                    <h3 id="modalTitleMobile" class="font-semibold text-base truncate">動画タイトル</h3>
                    <button onclick="closeModal()" class="text-gray-400 hover:text-white text-xl font-bold px-2">✕</button>
                </div>
                <div class="flex justify-center items-center aspect-video flex-grow bg-black">
                    <iframe id="modalIframe" src="" class="w-full h-full border-0" allowfullscreen></iframe>
                </div>
                <div class="p-4 bg-gray-900 text-white hidden md:flex justify-between items-center">
                    <h3 id="modalTitle" class="font-semibold text-base truncate">動画タイトル</h3>
                </div>
                <div class="p-4 bg-gray-50 dark:bg-gray-800 flex justify-between items-center border-t border-gray-100 dark:border-gray-700">
                    <a id="modalDriveLink" href="#" target="_blank" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg text-sm font-medium">
                        YouTube / 共有リンクで開く ↗
                    </a>
                    <button onclick="closeModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium">
                        閉じる
                    </button>
                </div>
            </div>

            <!-- 右側：同日のプレイリスト（タイムライン形式） -->
            <div class="w-full md:w-80 bg-gray-50 dark:bg-gray-900 border-l border-gray-200 dark:border-gray-700 flex flex-col max-h-60 md:max-h-none overflow-y-auto p-4">
                <div class="flex justify-between items-center mb-3">
                    <h4 class="font-bold text-sm text-gray-700 dark:text-gray-300">同日のプレイリスト</h4>
                    <button onclick="closeModal()" class="hidden md:block text-gray-400 hover:text-white text-xl font-bold px-2">✕</button>
                </div>
                <div id="playlistContainer" class="flex flex-col gap-2">
                    <!-- プレイリストアイテムがここに入ります -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // デプロイしたGASのウェブアプリURL（必要に応じてご自身のURLに書き換えてください）
        const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbyoDT1xiQfALehykUz72RnvORgw2-h4hUgtYi9dhmxfhsfJuaLYr0Lz5cvOaWHb-tdi2Q/exec';
        let allVideos = [];
        const VIDEO_DURATION_SEC = 900; // 1ファイルの長さ（900秒 = 15分）

        let currentPlaylist = [];
        let currentIndex = 0;

        let currentViewMode = localStorage.getItem('viewMode') || (window.innerWidth < 768 ? 'list' : 'grid');

        // テーマの初期化およびPC設定（メディアクエリ）の監視
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');

            function applyTheme(isDark) {
                const html = document.documentElement;
                if (isDark) {
                    html.classList.add('dark');
                } else {
                    html.classList.remove('dark');
                }
            }

            if (savedTheme === 'dark') {
                applyTheme(true);
            } else if (savedTheme === 'light') {
                applyTheme(false);
            } else {
                applyTheme(mediaQuery.matches);
            }

            mediaQuery.addEventListener('change', (e) => {
                if (!localStorage.getItem('theme')) {
                    applyTheme(e.matches);
                }
            });

            updateViewModeUI();
        })();

        function toggleDarkMode() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        function toggleViewMode() {
            currentViewMode = (currentViewMode === 'grid') ? 'list' : 'grid';
            localStorage.setItem('viewMode', currentViewMode);
            updateViewModeUI();
            filterAndRenderVideos();
        }

        function updateViewModeUI() {
            const gridIcon = document.getElementById('gridIcon');
            const listIcon = document.getElementById('listIcon');
            const btn = document.getElementById('viewModeBtn');

            if (currentViewMode === 'grid') {
                gridIcon.classList.add('hidden');
                listIcon.classList.remove('hidden');
                btn.title = 'リスト表示に切り替え';
            } else {
                gridIcon.classList.remove('hidden');
                listIcon.classList.add('hidden');
                btn.title = 'グリッド表示に切り替え';
            }
        }

        // データの取得と「Zoomキャプチャ 2026 10 16 09 24 59」形式のパース処理
        async function fetchVideos() {
            try {
                const response = await fetch(GAS_API_URL);
                allVideos = await response.json();
                document.getElementById('loading').style.display = 'none';
                
                allVideos.forEach(video => {
                    // カラム構成: 動画ID, 動画タイトル, 動画URL
                    const title = video['動画タイトル'] || video['ファイル名'] || '';
                    
                    // タイトルから「2026 10 16 09 24 59」のような連続した数字を抽出
                    // 例: Zoomキャプチャ2026 10 16 09 24 59 または 2026-10-16 09:24:59 などに対応
                    const cleanTitleNums = title.replace(/[^\d]/g, ' ');
                    const match = cleanTitleNums.match(/(\d{4})\s*(\d{2})\s*(\d{2})\s*(\d{2})\s*(\d{2})\s*(\d{2})/);

                    if (match) {
                        const year = match[1];
                        const month = match[2];
                        const day = match[3];
                        const hours = parseInt(match[4], 10);
                        const minutes = parseInt(match[5], 10);
                        const seconds = parseInt(match[6], 10);

                        video.extractedDate = `${year}-${month}-${day}`;
                        video.startSec = hours * 3600 + minutes * 60 + seconds;
                        video.endSec = video.startSec + VIDEO_DURATION_SEC;
                    } else {
                        video.extractedDate = '';
                        video.startSec = 0;
                        video.endSec = 0;
                    }
                });

                initDateFilterOptions(allVideos);
                filterAndRenderVideos();
            } catch (error) {
                console.error('データの取得に失敗しました:', error);
                document.getElementById('loading').innerHTML = '<span class="text-red-500">データの取得に失敗しました。GASのデプロイ設定を確認してください。</span>';
            }
        }

        function initDateFilterOptions(videos) {
            const dateSet = new Set();
            videos.forEach(v => {
                if (v.extractedDate) {
                    dateSet.add(v.extractedDate);
                }
            });

            const sortedDates = Array.from(dateSet).sort().reverse();
            const select = document.getElementById('dateFilter');
            
            sortedDates.forEach(date => {
                const option = document.createElement('option');
                option.value = date;
                option.textContent = date;
                select.appendChild(option);
            });
        }

        function filterAndRenderVideos() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const selectedDate = document.getElementById('dateFilter').value;
            const startTimeStr = document.getElementById('startTimeFilter').value;
            const endTimeStr = document.getElementById('endTimeFilter').value;

            let filterStartSec = null;
            let filterEndSec = null;

            if (startTimeStr) {
                const [h, m] = startTimeStr.split(':').map(Number);
                filterStartSec = h * 3600 + m * 60;
            }
            if (endTimeStr) {
                const [h, m] = endTimeStr.split(':').map(Number);
                filterEndSec = h * 3600 + m * 60;
            }

            const filtered = allVideos.filter(video => {
                const title = (video['動画タイトル'] || video['ファイル名'] || '').toLowerCase();
                const matchesKeyword = title.includes(keyword);
                const matchesDate = !selectedDate || video.extractedDate === selectedDate;

                let matchesTime = true;
                if (video.startSec !== null && video.endSec !== null && (filterStartSec !== null || filterEndSec !== null)) {
                    if (filterStartSec !== null && filterEndSec !== null) {
                        matchesTime = (video.startSec < filterEndSec) && (video.endSec > filterStartSec);
                    } else if (filterStartSec !== null) {
                        matchesTime = video.endSec > filterStartSec;
                    } else if (filterEndSec !== null) {
                        matchesTime = video.startSec < filterEndSec;
                    }
                }

                return matchesKeyword && matchesDate && matchesTime;
            });

            filtered.sort((a, b) => {
                const dateCompare = b.extractedDate.localeCompare(a.extractedDate);
                if (dateCompare !== 0) {
                    return dateCompare;
                }
                return a.startSec - b.startSec;
            });

            renderVideos(filtered);
        }

        function renderVideos(videos) {
            const container = document.getElementById('videoContainer');
            container.innerHTML = '';

            if (videos.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 dark:text-gray-400 py-8">該当する動画が見つかりませんでした。</p>';
                return;
            }

            if (currentViewMode === 'list') {
                const listViewDiv = document.createElement('div');
                listViewDiv.className = 'flex flex-col gap-3';

                videos.forEach((video) => {
                    const title = video['動画タイトル'] || video['ファイル名'] || '無題の動画';
                    const videoUrl = video['動画URL'] || video['共有リンク'] || '#';
                    const videoId = video['動画ID'] || '';

                    // YouTube URLから埋め込み用URLを生成
                    let embedUrl = '#';
                    if (videoUrl.includes('youtube.com/watch?v=')) {
                        const ytId = videoUrl.split('watch?v=')[1]?.split('&')[0];
                        if (ytId) embedUrl = `https://www.youtube.com/embed/${ytId}?autoplay=1`;
                    } else if (videoUrl.includes('youtu.be/')) {
                        const ytId = videoUrl.split('youtu.be/')[1]?.split('?')[0];
                        if (ytId) embedUrl = `https://www.youtube.com/embed/${ytId}?autoplay=1`;
                    } else if (videoId) {
                        embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
                    } else {
                        embedUrl = videoUrl;
                    }

                    const sameDateVideos = allVideos.filter(v => v.extractedDate === video.extractedDate);
                    sameDateVideos.sort((a, b) => a.startSec - b.startSec);
                    const playlistIndex = sameDateVideos.findIndex(v => (v['動画タイトル'] || v['ファイル名']) === title);

                    const listItem = document.createElement('div');
                    listItem.className = 'bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 flex items-center justify-between gap-3';
                    listItem.innerHTML = `
                        <div class="flex-1 min-w-0">
                            <h3 class="font-medium text-gray-800 dark:text-gray-100 text-sm truncate" title="${title}">${title}</h3>
                        </div>
                        <div class="flex items-center gap-2 flex-shrink-0">
                            <button onclick='openPlaylistModal(${JSON.stringify(sameDateVideos)}, ${playlistIndex})' 
                                    class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition-colors">
                                視聴
                            </button>
                            <a href="${videoUrl}" target="_blank" 
                               class="p-2 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 text-xs font-medium" title="リンクを開く">
                                ↗
                            </a>
                        </div>
                    `;
                    listViewDiv.appendChild(listItem);
                });
                container.appendChild(listViewDiv);

            } else {
                const gridViewDiv = document.createElement('div');
                gridViewDiv.className = 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6';

                videos.forEach((video) => {
                    const title = video['動画タイトル'] || video['ファイル名'] || '無題の動画';
                    const videoUrl = video['動画URL'] || video['共有リンク'] || '#';
                    const videoId = video['動画ID'] || '';

                    let embedUrl = '#';
                    let thumbUrl = '';
                    if (videoUrl.includes('youtube.com/watch?v=')) {
                        const ytId = videoUrl.split('watch?v=')[1]?.split('&')[0];
                        if (ytId) {
                            embedUrl = `https://www.youtube.com/embed/${ytId}?autoplay=1`;
                            thumbUrl = `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`;
                        }
                    } else if (videoUrl.includes('youtu.be/')) {
                        const ytId = videoUrl.split('youtu.be/')[1]?.split('?')[0];
                        if (ytId) {
                            embedUrl = `https://www.youtube.com/embed/${ytId}?autoplay=1`;
                            thumbUrl = `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`;
                        }
                    } else if (videoId) {
                        embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
                        thumbUrl = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
                    }

                    const sameDateVideos = allVideos.filter(v => v.extractedDate === video.extractedDate);
                    sameDateVideos.sort((a, b) => a.startSec - b.startSec);
                    const playlistIndex = sameDateVideos.findIndex(v => (v['動画タイトル'] || v['ファイル名']) === title);

                    const gridCard = document.createElement('div');
                    gridCard.className = 'bg-white dark:bg-gray-800 rounded-xl shadow-md overflow-hidden flex flex-col justify-between hover:shadow-lg transition-shadow duration-300 border border-gray-200 dark:border-gray-700';
                    gridCard.innerHTML = `
                        <div class="bg-gray-950 aspect-video relative cursor-pointer group overflow-hidden flex items-center justify-center"
                             onclick='openPlaylistModal(${JSON.stringify(sameDateVideos)}, ${playlistIndex})'>
                            ${thumbUrl ? `<img src="${thumbUrl}" class="w-full h-full object-cover opacity-90 group-hover:scale-105 transition-transform duration-300" alt="サムネイル">` : `<div class="w-full h-full bg-gray-900 flex items-center justify-center text-gray-400">プレビュー</div>`}
                            <div class="absolute inset-0 bg-black bg-opacity-20 group-hover:bg-opacity-10 transition-all flex items-center justify-center">
                                <div class="w-12 h-12 rounded-full bg-blue-600 bg-opacity-90 flex items-center justify-center text-white shadow-lg opacity-90 group-hover:scale-110 transition-transform">
                                    ▶
                                </div>
                            </div>
                        </div>
                        <div class="p-4 flex flex-col flex-grow justify-between">
                            <h3 class="font-semibold text-gray-800 dark:text-gray-100 text-base mb-3 line-clamp-2" title="${title}">${title}</h3>
                            <div class="flex gap-2 pt-2 border-t border-gray-100 dark:border-gray-700">
                                <button onclick='openPlaylistModal(${JSON.stringify(sameDateVideos)}, ${playlistIndex})' 
                                        class="flex-1 text-center bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 text-sm font-medium transition-colors">
                                    プレビュー視聴
                                </button>
                                <a href="${videoUrl}" target="_blank" 
                                   class="px-3 py-2 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 text-sm font-medium text-center" title="リンクを開く">
                                    ↗
                                </a>
                            </div>
                        </div>
                    `;
                    gridViewDiv.appendChild(gridCard);
                });
                container.appendChild(gridViewDiv);
            }
        }

        function openPlaylistModal(videosArray, index) {
            currentPlaylist = videosArray;
            currentIndex = index;
            playCurrentIndex();
            document.getElementById('videoModal').classList.remove('hidden');
        }

        function playCurrentIndex() {
            if (currentPlaylist.length === 0) return;
            const video = currentPlaylist[currentIndex];
            const title = video['動画タイトル'] || video['ファイル名'] || '無題の動画';
            const videoUrl = video['動画URL'] || video['共有リンク'] || '#';
            const videoId = video['動画ID'] || '';

            let embedUrl = '#';
            if (videoUrl.includes('youtube.com/watch?v=')) {
                const ytId = videoUrl.split('watch?v=')[1]?.split('&')[0];
                if (ytId) embedUrl = `https://www.youtube.com/embed/${ytId}?autoplay=1`;
            } else if (videoUrl.includes('youtu.be/')) {
                const ytId = videoUrl.split('youtu.be/')[1]?.split('?')[0];
                if (ytId) embedUrl = `https://www.youtube.com/embed/${ytId}?autoplay=1`;
            } else if (videoId) {
                embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
            } else {
                embedUrl = videoUrl;
            }

            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalTitleMobile').innerText = title;
            document.getElementById('modalIframe').src = embedUrl;
            document.getElementById('modalDriveLink').href = videoUrl;

            renderPlaylistSidebar();
        }

        function renderPlaylistSidebar() {
            const container = document.getElementById('playlistContainer');
            container.innerHTML = '';

            currentPlaylist.forEach((video, i) => {
                const title = video['動画タイトル'] || video['ファイル名'] || '無題の動画';
                const isCurrent = (i === currentIndex);

                const item = document.createElement('button');
                item.className = `w-full text-left p-3 rounded-xl text-xs transition-colors flex items-center gap-2 ${
                    isCurrent 
                        ? 'bg-blue-600 text-white font-bold shadow-md' 
                        : 'bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 border border-gray-200 dark:border-gray-700'
                }`;
                item.innerHTML = `
                    <span class="flex-shrink-0 w-5 text-center">${isCurrent ? '▶' : (i + 1)}</span>
                    <span class="truncate" title="${title}">${title}</span>
                `;
                item.onclick = () => {
                    currentIndex = i;
                    playCurrentIndex();
                };
                container.appendChild(item);
            });
        }

        function closeModal() {
            document.getElementById('videoModal').classList.add('hidden');
            document.getElementById('modalIframe').src = '';
            currentPlaylist = [];
        }

        // イベントリスナーの登録
        document.getElementById('searchInput').addEventListener('input', filterAndRenderVideos);
        document.getElementById('dateFilter').addEventListener('change', filterAndRenderVideos);
        document.getElementById('startTimeFilter').addEventListener('input', filterAndRenderVideos);
        document.getElementById('endTimeFilter').addEventListener('input', filterAndRenderVideos);

        fetchVideos();
    </script>
</body>
